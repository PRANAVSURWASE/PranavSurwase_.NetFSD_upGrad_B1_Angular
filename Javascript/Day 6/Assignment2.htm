<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

       <script>
         let marks =50;
         if(marks>=90)
         {
            console.log("Grade A+");
         }
         else if(marks>=75)
         {
            console.log("Grade A");

         }
         else if(marks>=60)
         {
            console.log("Grade B");
         }
         else if(marks>=40)
         {
            console.log("Grade C");
         }
         else{
            console.log("Fail")
         }

</script>
</head>
<body>

    <h1> Student Grade Evaluator</h1>
 
    
</body>
</html>
