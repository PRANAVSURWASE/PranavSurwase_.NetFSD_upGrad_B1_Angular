<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h2>Registration Form</h2>


    Name:
    <input type="text" id="name" onchange="validateName()">
    <span id="nameMsg" style="color:red;"></span>
    <br><br>


    Email:
    <input type="text" id="email" onchange="validateEmail()">
    <span id="emailMsg" style="color:red;"></span>
    <br><br>


    Age:
    <input type="number" id="age" onchange="validateAge()">
    <span id="ageMsg" style="color:red;"></span>
    <br><br>


    <button onclick="submitForm()">Register</button>

    <p id="successMsg" style="color:green;"></p>

    <script>
        function validateName() {
            let name = document.getElementById("name").value;
            if (name === "") {
                document.getElementById('nameMsg').innerText = "Name Can Not be Empty"

            } else {
                document.getElementById("nameMsg").innerText = "";
                return true;
            }
        }

        function validateEmail() {
            let email = document.getElementById('email').value;
            if (!email.includes('@')) {
                document.getElementById('emailMsg').innerText = "Email must include @";
                return false;
            }
            else {
                document.getElementById('emailMsg').innerText = "";
                return true;
            }
        }


        function validateAge() {
            let age = document.getElementById('age').value;
            if (age <= 18 || age === "") {
                document.getElementById("ageMsg").innerText = "Age must br greater than 18"
                return false;
            }
            else {
                document.getElementById("ageMsg").innerText = "";
                return true;
            }
        }

        function submitForm() {
            let isNameValid = validateName();
            let isEmailValid = validateEmail();
            let isAgeValid = validateAge();

            if (isNameValid && isEmailValid && isAgeValid) {
                let userData={
                    name:document.getElementById("name").value,
                    email:document.getElementById('email').value,
                    age:document.getElementById('age').value
                }

                sessionStorage.setItem('user',JSON.stringify(userData));
                document.getElementById("successMsg").innerText="REgistration Sucessful !! Data Stored in session storage ";


            }else{
                document.getElementById("successMsg").innerText=""
            }
        }
    </script>

</body>

</html>
