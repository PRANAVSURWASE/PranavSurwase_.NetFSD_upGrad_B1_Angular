<!DOCTYPE html>
<html>
<head>
    <title>Location Logger</title>
</head>
<body>

    <h2> Location Based Weather Logger</h2>

    <button onclick="getLocation()">Get My Location</button>

    <h3>Current Location</h3>
    <p id="currentLocation"></p>
    <p id="errorMsg" style="color:red;"></p>

    <h3>Last 5 Locations</h3>
    <ul id="historyList"></ul>

    <script>


        window.onload = function () {
            displayHistory();
        };

        function getLocation() {

            if (navigator.geolocation) {

                navigator.geolocation.getCurrentPosition(
                    successCallback,
                    errorCallback,
                    { timeout: 10000 }
                );

            } else {
                document.getElementById("errorMsg").innerText =
                    "Geolocation is not supported by this browser.";
            }
        }

        function successCallback(position) {

            document.getElementById("errorMsg").innerText = "";

            let latitude = position.coords.latitude;
            let longitude = position.coords.longitude;

            document.getElementById("currentLocation").innerText =
                "Latitude: " + latitude + " , Longitude: " + longitude;

            let locationData = {
                lat: latitude,
                lon: longitude,
                time: new Date().toLocaleString()
            };

            saveLocation(locationData);
        }

       
        function errorCallback(error) {

            let message = "";

            switch (error.code) {

                case error.PERMISSION_DENIED:
                    message = "Permission Denied by user.";
                    break;

                case error.POSITION_UNAVAILABLE:
                    message = "Location information unavailable.";
                    break;

                case error.TIMEOUT:
                    message = "Request timed out.";
                    break;

                default:
                    message = "An unknown error occurred.";
            }

            document.getElementById("errorMsg").innerText = message;
        }

        
        function saveLocation(locationData) {

            let history = localStorage.getItem("locationHistory");

            if (history) {
                history = JSON.parse(history);
            } else {
                history = [];
            }

            history.unshift(locationData); 

            if (history.length > 5) {
                history.pop(); 
            }

            localStorage.setItem("locationHistory",
                JSON.stringify(history));

            displayHistory();
        }

      
        function displayHistory() {

            let history = localStorage.getItem("locationHistory");

            if (!history) return;

            history = JSON.parse(history);

            let list = document.getElementById("historyList");
            list.innerHTML = "";

            history.forEach(function (item) {

                let li = document.createElement("li");

                li.innerText =
                    item.time + " → Lat: " + item.lat +
                    " , Lon: " + item.lon;

                list.appendChild(li);
            });
        }

    </script>

</body>
</html>
