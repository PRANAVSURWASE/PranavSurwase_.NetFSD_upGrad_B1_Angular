<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 4</title>
</head>
<body>
     <header>
        <h1>Sky Travels</h1>
        <nav>
            <a href="#">Home</a> |
            <a href="#">Flights</a> |
            <a href="#">Offers</a> |
            <a href="#">Contact</a>
        </nav>
        <hr>
    </header>

    <main>

        <section>
            <h2>Explore The World With Us</h2>
            <video width="400" controls poster="travel.jpg">
                <source src="travel.mp4" type="video/mp4">
                <source src="travel.webm" type="video/webm">
                Your browser does not support the video tag.
            </video>
        </section>

        
        <section>
            <h2>Travel Theme Music</h2>
            <audio controls>
            <source src="HTML5_HandsOn_a1.mp3" type="audio/mp3">
        </audio>
        </section>

        <hr>
         <section>
            <h2>Book Your Flight</h2>

            <form>

               
                <label>Source City:</label><br>
                <input list="cities" name="source" required>

               
                <br>
                <label>Destination City:</label><br>
                <input list="cities" name="destination" required>

               
                <datalist id="cities">
                    <option value="Mumbai">
                    <option value="Delhi">
                    <option value="Bangalore">
                    <option value="Chennai">
                    <option value="Hyderabad">
                    <option value="Dubai">
                    <option value="London">
                </datalist>

                <br>

                 <label>Departure Date:</label><br>
                <input type="date" id="departure" name="departure" required>

                <br>

                
                <label>Return Date:</label><br>
                <input type="date" id="return" name="return" required>

                <br>

                <label>Travel Class:</label><br>
                <select name="class" required>
                    <option value="">Select Class</option>
                    <option>Economy</option>
                    <option>Premium Economy</option>
                    <option>Business</option>
                    <option>First Class</option>
                </select>

                <br>

                <label>Preferred Airline:</label><br>
                <input list="airlines" name="airline" required>

                <datalist id="airlines">
                    <option value="IndiGo">
                    <option value="Air India">
                    <option value="Emirates">
                    <option value="Qatar Airways">
                </datalist>

                <br>
                 <label>Number of Passengers:</label><br>
                <input type="number" name="passengers" min="1" max="10" required>

                <br><br>

                <label>Meal Preference Color Tag:</label><br>
                <input type="color" name="mealColor" required>

                <br><br>

                
               

                <br><br>

                <button type="submit">Confirm Booking</button>


</body>
</html>
